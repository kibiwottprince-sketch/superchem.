
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Alert</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #020604;
  color: #00ff66;
  font-family: Consolas, monospace;
  overflow-x: hidden;
}

main {
  position: relative;
  z-index: 1;
  width: min(760px, 92%);
  margin: 40px auto;
  padding: 25px;
  border: 1px solid #00ff66;
  box-shadow: 0 0 25px #00ff6633;
  background: #020604ee;
}

h1 {
  color: #ff3030;
  text-align: center;
  text-shadow: 0 0 12px red;
  animation: flicker 1.4s infinite;
}

.warning {
  border: 1px solid red;
  padding: 14px;
  color: #ff5555;
  text-align: center;
  margin: 20px 0;
}

#terminal {
  height: 190px;
  overflow: hidden;
  color: #00ff66;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.question {
  text-align: center;
  color: white;
  font-size: 22px;
  margin-top: 25px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

button {
  padding: 13px 27px;
  font-family: inherit;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  border: 1px solid;
}

#yes {
  color: black;
  background: #00ff66;
  border-color: #00ff66;
}

#no {
  color: white;
  background: #8b0000;
  border-color: red;
}

#result {
  text-align: center;
  color: #ff3030;
  font-size: 24px;
  font-weight: bold;
  margin-top: 25px;
}

#clock {
  font-size: 40px;
  text-align: center;
  color: red;
  text-shadow: 0 0 15px red;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .16;
  pointer-events: none;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: .65; }
}
</style>
</head>

<body>
<canvas id="matrix"></canvas>

<main>
  <h1>⚠ SYSTEM COMPROMISED ⚠</h1>

  <div class="warning">
    SECURITY ALERT: SIMULATED SYSTEM INTRUSION<br>
    UNKNOWN USER DETECTED
  </div>

  <div id="terminal"></div>

  <p style="text-align:center;color:white">
    SIMULATION COUNTDOWN
  </p>
  <div id="clock">10</div>

  <div class="question">
    ARE YOU AN IDIOT?
  </div>

  <div class="buttons">
    <button id="yes">YES</button>
    <button id="no">NO</button>
  </div>

  <div id="result"></div>

  <p style="text-align:center;font-size:11px;color:#6c8">
    CINEMATIC PRANK SIMULATION
  </p>
</main>

<script>
const terminal = document.getElementById("terminal");

const lines = [
  "> Initializing cinematic simulation...",
  "> Loading imaginary security scan...",
  "> Checking fictional system status...",
  "> WARNING: DRAMA LEVEL CRITICAL",
  "> Running harmless visual effects...",
  "> Awaiting user's decision..."
];

let lineIndex = 0;

function addLine() {
  const line = document.createElement("div");
  line.textContent = lines[lineIndex % lines.length];
  terminal.appendChild(line);

  while (terminal.children.length > 8) {
    terminal.removeChild(terminal.firstChild);
  }

  lineIndex++;
}

addLine();
setInterval(addLine, 900);

let seconds = 10;
const clock = document.getElementById("clock");

const countdown = setInterval(() => {
  seconds--;
  clock.textContent = Math.max(seconds, 0);

  if (seconds <= 0) {
    clearInterval(countdown);
    clock.textContent = "!";
    document.getElementById("result").textContent =
      "WARNING! DRAMA LEVEL: MAXIMUM";
  }
}, 1000);

document.getElementById("no").addEventListener("click", () => {
  document.getElementById("result").textContent =
    "DENIAL DETECTED! 😂 TRY AGAIN!";
});

document.getElementById("yes").addEventListener("click", () => {
  document.getElementById("result").textContent =
    "I KNEW IT! 😂 YOU GOT PRANKED!";
  clearInterval(countdown);
  clock.textContent = "LOL";
});

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
const chars = "01ABCDEF<>/{}";
let drops = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drops = Array(Math.ceil(canvas.width / 15)).fill(1);
}

window.addEventListener("resize", resize);
resize();

setInterval(() => {
  ctx.fillStyle = "rgba(2,6,4,0.13)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#00ff66";
  ctx.font = "14px monospace";

  drops.forEach((y, i) => {
    const char = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(char, i * 15, y * 15);

    if (y * 15 > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  });
}, 65);
</script>
</body>
</html>
